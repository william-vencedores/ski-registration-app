name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Deploy frontend to S3 + CloudFront ──────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Build client
        run: cd client && npm run build
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync client/dist/ s3://${{ secrets.S3_FRONTEND_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  # ── Deploy backend via SAM ──────────────────────────────
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install and build Lambda
        run: |
          cd server-lambda
          npm ci
          npm run build:sam

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2

      - name: SAM build
        run: cd server-lambda && sam build

      - name: SAM deploy
        run: |
          cd server-lambda
          sam deploy \
            --stack-name vencedores-ski \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "DynamoTableName=${{ secrets.DYNAMODB_TABLE }}" \
              "JwtSecret=${{ secrets.JWT_SECRET }}" \
              "StripeSecretKey=${{ secrets.STRIPE_SECRET_KEY }}" \
              "StripeWebhookSecret=${{ secrets.STRIPE_WEBHOOK_SECRET || 'none' }}" \
              "AdminUsername=${{ secrets.ADMIN_USERNAME }}" \
              "AdminPassword=${{ secrets.ADMIN_PASSWORD }}" \
              "ClientUrl=${{ secrets.CLIENT_URL }}" \
              "EmailFrom=${{ secrets.EMAIL_FROM }}"
